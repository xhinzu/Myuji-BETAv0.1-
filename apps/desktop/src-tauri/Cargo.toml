[package]
name = "myujiku-desktop"
version = "2.0.0"
description = "MyuJiku v2 — Standalone Windows desktop music player with synced word-by-word lyrics"
authors = ["MyuJiku Team"]
edition = "2021"

[lib]
name = "myujiku_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
lofty = "0.21"
notify = "8.0"
walkdir = "2.5"
